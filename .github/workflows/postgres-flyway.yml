name: PostgreSQL Flyway G1 preflight (disposable)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'scripts/verify_flyway_postgres.py'
      - 'tests/release/test_build27_flyway_contract.py'
      - '.github/workflows/postgres-flyway.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reelnest
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: reelnest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelnest -d reelnest"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/reelnest
      DB_USER: reelnest
      DB_PASSWORD: local_dev_only
      REELNEST_TEST_DB_DSN: postgresql://reelnest:local_dev_only@127.0.0.1:5432/reelnest
      REELNEST_DISPOSABLE_DB: 'true'
      # Deliberately DB-only. Redis/Rabbit are validated by separate full G1.
      MANAGEMENT_HEALTH_REDIS_ENABLED: 'false'
      MANAGEMENT_HEALTH_RABBIT_ENABLED: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
      JWT_ISSUER_URI: http://localhost:8180/realms/reelnest
      JWT_JWKS_URI: http://localhost:8180/realms/reelnest/protocol/openid-connect/certs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build actual API jar
        working-directory: apps/api
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Install disposable DB verification dependencies
        run: python3 -m pip install 'psycopg[binary]>=3.2,<4' pytest
      - name: Boot API and verify migrated PostgreSQL schema
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          java -jar apps/api/target/reelnest-api-0.1.0-SNAPSHOT.jar > build-evidence/g1-db-startup.local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 75); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Spring application terminated during disposable PostgreSQL boot"
              tail -n 90 build-evidence/g1-db-startup.local.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Spring DB-only health check timed out"
            tail -n 90 build-evidence/g1-db-startup.local.log
            exit 1
          fi
          python3 scripts/verify_flyway_postgres.py
          python3 scripts/test_public_catalog_revocation_live.py
          python3 scripts/test_avod_schema_live.py
          python3 -m pytest tests/release/test_build27_flyway_contract.py -q

      - name: Verify V1–V9 to V27 upgrade on a separate disposable database
        working-directory: apps/api
        env:
          REELNEST_UPGRADE_DB_URL: jdbc:postgresql://127.0.0.1:5432/reelnest_upgrade
          REELNEST_DISPOSABLE_DB: 'true'
        run: |
          python3 - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://reelnest:local_dev_only@127.0.0.1:5432/postgres',autocommit=True) as conn:
              conn.execute('CREATE DATABASE reelnest_upgrade')
          PY
          mvn --batch-mode --no-transfer-progress -Dtest=FlywayUpgradeTest test
      - name: Verify nullable catalog filters and pagination on PostgreSQL
        working-directory: apps/api
        env:
          REELNEST_CATALOG_DB_URL: jdbc:postgresql://127.0.0.1:5432/reelnest_catalog_test
          REELNEST_DISPOSABLE_DB: 'true'
        run: |
          python3 - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://reelnest:local_dev_only@127.0.0.1:5432/postgres',autocommit=True) as conn:
              conn.execute('CREATE DATABASE reelnest_catalog_test')
          PY
          mvn --batch-mode --no-transfer-progress -Dtest=CatalogPostgresTest test
      - name: Verify playback admission, first-user transactions and authorization on PostgreSQL
        working-directory: apps/api
        env:
          REELNEST_SECURITY_DB_URL: jdbc:postgresql://127.0.0.1:5432/reelnest_security_test
          REELNEST_DISPOSABLE_DB: 'true'
        run: |
          python3 - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://reelnest:local_dev_only@127.0.0.1:5432/postgres',autocommit=True) as conn:
              conn.execute('CREATE DATABASE reelnest_security_test')
          PY
          mvn --batch-mode --no-transfer-progress -Dtest=PlaybackPostgresSecurityTest test
      - name: Sanitize database-startup diagnostics
        if: always()
        run: |
          if [ -f build-evidence/g1-db-startup.local.log ]; then
            python3 scripts/cloud_evidence.py --sanitize-log build-evidence/g1-db-startup.local.log build-evidence/g1-db-startup.sanitized.log
          fi
      - name: Preserve migration and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-flyway-${{ github.sha }}
          path: |
            build-evidence/g1-db-startup.sanitized.log
            apps/api/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
