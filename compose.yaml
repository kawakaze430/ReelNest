# DEVELOPMENT ONLY. The passwords below are non-secret example values.
# Never expose this stack to the public internet or reuse these values in production.
name: reelnest
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reelnest
      POSTGRES_USER: reelnest
      POSTGRES_PASSWORD: local_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelnest -d reelnest"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_only
    volumes: ["keycloak_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_only
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local_admin_only
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./infrastructure/keycloak/reelnest-realm.json:/opt/keycloak/data/import/reelnest-realm.json:ro
    depends_on:
      keycloak-db: {condition: service_healthy}

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: reelnest
      RABBITMQ_DEFAULT_PASS: local_dev_only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: reelnest_dev
      MINIO_ROOT_PASSWORD: local_minio_only_123
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: ["minio_data:/data"]

  minio-init:
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      minio: {condition: service_started}
    volumes:
      - ./infrastructure/minio/source-cors.xml:/minio-config/source-cors.xml:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 reelnest_dev local_minio_only_123; do sleep 2; done
        mc mb --ignore-existing local/reelnest-source-private
        mc mb --ignore-existing local/reelnest-processed-private
        mc anonymous set none local/reelnest-source-private
        mc anonymous set none local/reelnest-processed-private
        mc cors set local/reelnest-source-private /minio-config/source-cors.xml
        echo 'Private developer media buckets ready; no anonymous grants added'


  video-worker:
    build:
      context: ./apps/video-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://reelnest:local_dev_only@postgres:5432/reelnest
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: reelnest_dev
      S3_SECRET_KEY: local_minio_only_123
      S3_REGION: us-east-1
      SOURCE_BUCKET: reelnest-source-private
      PROCESSED_BUCKET: reelnest-processed-private
      MAX_VIDEO_SECONDS: "14400"
      MAX_ENCODE_SECONDS: "3600"
    # Private processed bucket remains inaccessible without credentials.
    # Dedicated scratch volume avoids filling the container writable layer.
    volumes:
      - media_scratch:/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  recommendation-api:
    build:
      context: ./apps/recommendation-api
    environment:
      # LOCAL DEV ONLY. Replace for staging/production using a secret manager.
      RECOMMENDER_INTERNAL_TOKEN: ${RECOMMENDER_INTERNAL_TOKEN:-local-dev-ml-secret-replace-in-production}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./apps/api
    environment:
      RECOMMENDATION_ENABLED: "true"
      RECOMMENDATION_INTERNAL_URL: http://recommendation-api:8000
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDER_INTERNAL_TOKEN:-local-dev-ml-secret-replace-in-production}
      DB_URL: jdbc:postgresql://postgres:5432/reelnest
      DB_USER: reelnest
      DB_PASSWORD: local_dev_only
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: reelnest
      RABBITMQ_PASSWORD: local_dev_only
      JWT_ISSUER_URI: http://localhost:8180/realms/reelnest
      JWT_JWKS_URI: http://keycloak:8080/realms/reelnest/protocol/openid-connect/certs
      JWT_REQUIRED_AUDIENCE: reelnest-api
      JWT_REQUIRED_CLIENT: reelnest-web
      CORS_ORIGIN: http://localhost:3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: reelnest_dev
      S3_SECRET_KEY: local_minio_only_123
      S3_SOURCE_BUCKET: reelnest-source-private
      S3_PROCESSED_BUCKET: reelnest-processed-private
      PLAYBACK_TRUSTED_COUNTRY: IN
      PLAYBACK_DEV_PROXY_ENABLED: "true"
      # Razorpay TEST credentials: set in local shell or .env, never commit live secrets.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_STANDARD_PLAN_ID: ${RAZORPAY_STANDARD_PLAN_ID:-}
      RAZORPAY_PREMIUM_PLAN_ID: ${RAZORPAY_PREMIUM_PLAN_ID:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_started}
      redis: {condition: service_started}
      rabbitmq: {condition: service_started}
      recommendation-api: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      API_INTERNAL_BASE_URL: http://api:8080
      NEXT_PUBLIC_AUTHORITY: http://localhost:8180/realms/reelnest
      NEXT_PUBLIC_OIDC_CLIENT_ID: reelnest-web
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
      WATCHPACK_POLLING: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_started}

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  media_scratch:
