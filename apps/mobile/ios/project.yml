name: ReelNestCatalogPreview
options:
  bundleIdPrefix: com.reelnest.preview
targets:
  ReelNestCatalogPreview:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
    info:
      path: build/generated/ios/Info.plist
      properties:
        CFBundleDisplayName: ReelNest Catalog Preview
        ReelNestAPIOrigin: https://api.example.org
        CFBundleURLTypes:
          - CFBundleURLName: com.reelnest.catalog.preview
            CFBundleURLSchemes: [reelnest-preview]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelnest.preview.catalog
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  ReelNestTVPreview:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
    info:
      path: build/generated/tvos/Info.plist
      properties:
        CFBundleDisplayName: ReelNest TV Catalog Preview
        ReelNestAPIOrigin: https://api.example.org
        CFBundleURLTypes:
          - CFBundleURLName: com.reelnest.catalog.preview
            CFBundleURLSchemes: [reelnest-preview]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelnest.preview.tv
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
